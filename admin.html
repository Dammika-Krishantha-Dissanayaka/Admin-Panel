<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Krishan Lottery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: white; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .card-body { padding: 30px; }
        .login-box { max-width: 400px; margin: 100px auto; }
        .login-box input { width: 100%; padding: 14px; margin: 12px 0; border: 2px solid #e5e7eb; border-radius: 14px; font-size: 16px; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; overflow-x: auto; display: block; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #667eea; color: white; }
        .status-active { background: #dcfce7; color: #16a34a; padding: 4px 8px; border-radius: 12px; display: inline-block; }
        .status-pending { background: #fed7aa; color: #9a3412; padding: 4px 8px; border-radius: 12px; display: inline-block; }
        .status-expired { background: #fee2e2; color: #dc2626; padding: 4px 8px; border-radius: 12px; display: inline-block; }
        .btn-sm { padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; margin: 2px; font-size: 12px; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .message { margin-top: 15px; padding: 12px; border-radius: 12px; text-align: center; }
        .message-error { background: #fee2e2; color: #dc2626; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: none; border: none; font-size: 16px; cursor: pointer; }
        .tab.active { color: #667eea; border-bottom: 3px solid #667eea; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 20px; text-align: center; }
        .stat-card .number { font-size: 32px; font-weight: bold; }
        .loading { text-align: center; padding: 40px; color: #9ca3af; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .row-select { width: 40px; text-align: center; }
        .payment-card { background: #f8f9fa; border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .bulk-bar { background: #f3f4f6; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .bulk-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .bulk-btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .bulk-activate { background: #10b981; color: white; }
        .bulk-block { background: #ef4444; color: white; }
        @media (max-width: 768px) { th, td { font-size: 12px; padding: 8px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1><i class="fas fa-crown"></i> Admin Panel</h1>
                <p>Krishan Lottery System - User & Payment Management</p>
            </div>
            <div class="card-body">
                <!-- Login -->
                <div id="loginBox" class="login-box">
                    <input type="email" id="adminEmail" placeholder="admin@lottery.com" value="admin@lottery.com">
                    <input type="password" id="adminPassword" placeholder="Password">
                    <button class="btn" onclick="adminLogin()"><i class="fas fa-sign-in-alt"></i> Admin Login</button>
                    <div id="loginMsg"></div>
                </div>

                <!-- Dashboard -->
                <div id="dashboard" style="display:none;">
                    <div class="stats" id="statsContainer">
                        <div class="stat-card"><div class="number" id="totalUsers">0</div><div class="label">Total Users</div></div>
                        <div class="stat-card"><div class="number" id="pendingPayments">0</div><div class="label">Pending Payments</div></div>
                        <div class="stat-card"><div class="number" id="activeUsers">0</div><div class="label">Active Users</div></div>
                    </div>

                    <div class="tabs">
                        <button class="tab active" onclick="showTab('payments')">💰 Payment Requests</button>
                        <button class="tab" onclick="showTab('users')">👥 All Users</button>
                        <button class="tab" onclick="showTab('active')">✅ Active Users</button>
                    </div>

                    <div id="paymentsTab" class="tab-content active">
                        <div id="paymentsList"><div class="loading"><div class="spinner"></div></div></div>
                    </div>

                    <div id="usersTab" class="tab-content">
                        <div class="bulk-bar" id="bulkBar" style="display:none;">
                            <div class="bulk-actions">
                                <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()"> Select All
                                <span id="selectedCount">0 selected</span>
                            </div>
                            <div class="bulk-actions">
                                <button class="bulk-btn bulk-activate" onclick="bulkActivate()">✅ Bulk Activate</button>
                                <button class="bulk-btn bulk-block" onclick="bulkBlock()">⛔ Bulk Block</button>
                            </div>
                        </div>
                        <div id="usersList"><div class="loading"><div class="spinner"></div></div></div>
                    </div>

                    <div id="activeTab" class="tab-content">
                        <div id="activeUsersList"><div class="loading"><div class="spinner"></div></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDIvLPukOF4T1p0DOkXjXQ-y-9mWME5QXw",
            authDomain: "krishanlotterysystem.firebaseapp.com",
            projectId: "krishanlotterysystem",
            storageBucket: "krishanlotterysystem.firebasestorage.app",
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allUsers = [];
        let selectedUserIds = new Set();

        // ==================== ADMIN LOGIN ====================
        window.adminLogin = async function() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const msgDiv = document.getElementById('loginMsg');

            if (!email || !password) {
                msgDiv.innerHTML = '<div class="message message-error">❌ Enter email and password</div>';
                return;
            }

            try {
                await auth.signInWithEmailAndPassword(email, password);
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadAllData();
            } catch (e) {
                if (e.code === 'auth/user-not-found') {
                    msgDiv.innerHTML = '<div class="message message-error">❌ Admin user not found. Please create admin@lottery.com in Firebase Authentication.</div>';
                } else if (e.code === 'auth/wrong-password') {
                    msgDiv.innerHTML = '<div class="message message-error">❌ Wrong password</div>';
                } else {
                    msgDiv.innerHTML = '<div class="message message-error">❌ ' + e.message + '</div>';
                }
            }
        };

        // ==================== LOAD DATA ====================
        async function loadAllData() {
            await loadStats();
            await loadPayments();
            await loadUsers();
            await loadActiveUsers();
        }

        async function loadStats() {
            const users = await db.collection('users').get();
            const pending = await db.collection('paymentRequests').where('status', '==', 'pending').get();
            const active = await db.collection('users').where('status', '==', 'active').get();
            document.getElementById('totalUsers').textContent = users.size;
            document.getElementById('pendingPayments').textContent = pending.size;
            document.getElementById('activeUsers').textContent = active.size;
        }

        async function loadPayments() {
            const snapshot = await db.collection('paymentRequests').where('status', '==', 'pending').get();
            if (snapshot.empty) {
                document.getElementById('paymentsList').innerHTML = '<p style="text-align:center;padding:20px;">No pending payments</p>';
                return;
            }
            let html = '';
            snapshot.forEach(doc => {
                const p = doc.data();
                html += `
                    <div class="payment-card">
                        <div>
                            <strong>${p.userName}</strong><br>
                            <small>${p.userPhone} | Rs.${p.amount}</small>
                        </div>
                        <div>
                            <button class="btn-sm btn-success" onclick="approvePayment('${doc.id}','${p.userId}')">Approve</button>
                            <button class="btn-sm btn-danger" onclick="rejectPayment('${doc.id}')">Reject</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('paymentsList').innerHTML = html;
        }

        window.approvePayment = async function(reqId, userId) {
            const expiry = new Date();
            expiry.setDate(expiry.getDate() + 30);
            await db.collection('users').doc(userId).update({ status: 'active', subscriptionExpiry: expiry });
            await db.collection('paymentRequests').doc(reqId).update({ status: 'approved' });
            alert('✅ User activated for 30 days');
            loadAllData();
        };

        window.rejectPayment = async function(reqId) {
            await db.collection('paymentRequests').doc(reqId).update({ status: 'rejected' });
            alert('❌ Payment rejected');
            loadPayments();
        };

        async function loadUsers() {
            const snapshot = await db.collection('users').get();
            allUsers = [];
            snapshot.forEach(doc => allUsers.push({ id: doc.id, ...doc.data() }));
            renderUsers();
        }

        function renderUsers() {
            if (allUsers.length === 0) {
                document.getElementById('usersList').innerHTML = '<p style="text-align:center;padding:20px;">No users</p>';
                return;
            }
            let html = `<table><thead><tr><th class="row-select"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()"></th><th>Name</th><th>Phone</th><th>Status</th></tr></thead><tbody>`;
            allUsers.forEach(u => {
                const checked = selectedUserIds.has(u.id) ? 'checked' : '';
                html += `<tr>
                    <td class="row-select"><input type="checkbox" class="user-checkbox" data-id="${u.id}" onchange="updateSelectedUsers()" ${checked}></td>
                    <td>${u.fullName}</td>
                    <td>${u.phone}</td>
                    <td><span class="status-${u.status}">${u.status}</span></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById('usersList').innerHTML = html;
            document.getElementById('bulkBar').style.display = selectedUserIds.size > 0 ? 'flex' : 'none';
            document.getElementById('selectedCount').textContent = `${selectedUserIds.size} selected`;
        }

        async function loadActiveUsers() {
            const snapshot = await db.collection('users').where('status', '==', 'active').get();
            if (snapshot.empty) {
                document.getElementById('activeUsersList').innerHTML = '<p style="text-align:center;padding:20px;">No active users</p>';
                return;
            }
            let html = `<table><thead><tr><th>Name</th><th>Phone</th></tr></thead><tbody>`;
            snapshot.forEach(doc => {
                const u = doc.data();
                html += `<tr><td>${u.fullName}</td><td>${u.phone}</td></tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById('activeUsersList').innerHTML = html;
        }

        // ==================== BULK ACTIONS ====================
        window.toggleSelectAll = function() {
            const selectAll = document.getElementById('selectAllCheckbox');
            document.querySelectorAll('.user-checkbox').forEach(cb => {
                cb.checked = selectAll.checked;
                if (selectAll.checked) selectedUserIds.add(cb.dataset.id);
                else selectedUserIds.delete(cb.dataset.id);
            });
            renderUsers();
        };

        window.updateSelectedUsers = function() {
            document.querySelectorAll('.user-checkbox').forEach(cb => {
                if (cb.checked) selectedUserIds.add(cb.dataset.id);
                else selectedUserIds.delete(cb.dataset.id);
            });
            renderUsers();
        };

        window.bulkActivate = async function() {
            if (selectedUserIds.size === 0) return alert('Select users first');
            if (!confirm(`Activate ${selectedUserIds.size} users?`)) return;
            const expiry = new Date();
            expiry.setDate(expiry.getDate() + 30);
            let count = 0;
            for (const id of selectedUserIds) {
                try { await db.collection('users').doc(id).update({ status: 'active', subscriptionExpiry: expiry }); count++; } catch (e) {}
            }
            alert(`✅ ${count} users activated`);
            selectedUserIds.clear();
            loadAllData();
        };

        window.bulkBlock = async function() {
            if (selectedUserIds.size === 0) return alert('Select users first');
            if (!confirm(`Block ${selectedUserIds.size} users?`)) return;
            let count = 0;
            for (const id of selectedUserIds) {
                try { await db.collection('users').doc(id).update({ status: 'blocked' }); count++; } catch (e) {}
            }
            alert(`⛔ ${count} users blocked`);
            selectedUserIds.clear();
            loadAllData();
        };

        // ==================== TABS ====================
        window.showTab = function(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        };

        // Auto login check
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                await loadAllData();
            }
        });
    </script>
</body>
</html>
